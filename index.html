<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳本</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#24364A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳本">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#EEF0E6; --card:#F8F9F3; --ink:#1E2B33; --ink-2:#56646B; --ink-3:#8A9599;
  --rule:#A9BDB5; --rule-soft:#D3DDD6; --cover:#24364A; --cover-ink:#E9ECE2;
  --seal:#B8372A; --plus:#2E6B5E; --focus:#3F6FA0;
  --num:"EB Garamond","Noto Serif TC",Georgia,serif;
  --serif:"Noto Serif TC","Songti TC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r-sm:4px; --r-md:8px;
  --tab-h:52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131A1F; --card:#1A232A; --ink:#E3E7DD; --ink-2:#A3AEAB; --ink-3:#6F7C7C;
    --rule:#3F5752; --rule-soft:#26343A; --cover:#0E1821; --cover-ink:#DCE2D6;
    --seal:#D4553F; --plus:#62A894; --focus:#7FA8D6;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-variant-numeric:lining-nums tabular-nums}

/* ---------- header: the ledger's cloth cover */
.top{position:sticky;top:0;z-index:20;background:var(--cover);color:var(--cover-ink);
  padding:calc(env(safe-area-inset-top) + 6px) 16px 6px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.18em;margin:0;line-height:1.2}
.brand small{display:block;font-family:var(--num);font-weight:400;font-size:11px;letter-spacing:.08em;opacity:.65;margin-top:-2px}
.top .spacer{flex:1}
.curswitch{display:flex;border:1px solid rgba(233,236,226,.35);border-radius:999px;padding:2px}
.curswitch button{background:none;border:0;color:inherit;font-family:var(--num);font-size:13px;padding:3px 10px;border-radius:999px;opacity:.7}
.curswitch button[aria-pressed="true"]{background:var(--cover-ink);color:var(--cover);opacity:1;font-weight:600}
.iconbtn{background:none;border:0;color:inherit;padding:6px;border-radius:6px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

main{max-width:760px;margin:0 auto;padding:8px 16px 0}
.view{display:none}
.view.on{display:block}
h2.vt{font-family:var(--serif);font-weight:700;font-size:19px;margin:6px 0 12px;letter-spacing:.06em}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

/* ---------- tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);font-family:var(--serif);font-size:13px;letter-spacing:.1em}
.tabs button i{width:22px;height:22px;display:grid;place-items:center;font-style:normal;font-family:var(--serif);font-size:13px;border:1px solid currentColor;border-radius:3px;line-height:1}
.tabs button[aria-current="page"]{color:var(--seal)}
.tabs button[aria-current="page"] i{background:var(--seal);color:var(--card);border-color:var(--seal)}

/* ---------- shared bits */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg.type button[data-v="補貼"][aria-pressed="true"]{background:var(--plus)}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip.tpl{border-color:var(--ink-2);font-weight:500}
.chip.tpl .ok{color:var(--plus);margin-left:5px;font-size:12px;font-weight:400}
.chip.tpl.done{border-style:dashed;color:var(--ink-2)}
.field{margin:10px 0 0}
.field>label,.flabel{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px;letter-spacing:.04em}
.inl{display:flex;align-items:center;gap:8px}.inl>.flabel{margin:0;flex:none;white-space:nowrap}.inl>.chips{flex:1;min-width:0;padding:2px 0}
.input,select.input,textarea.input{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 11px;font-size:15px;min-height:40px}
textarea.input{min-height:64px;resize:vertical}
.input:focus{border-color:var(--ink-2);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:var(--r-md);padding:11px 18px;font-size:15px;font-family:var(--serif);letter-spacing:.12em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.danger{background:transparent;color:var(--seal);border-color:var(--seal)}
.btn.danger.armed{background:var(--seal);color:var(--card)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-size:13px}

/* seal tile: the memorable element */
.seal{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:4px;border:1.5px solid var(--c,#777);color:var(--c,#777);
  font-family:var(--serif);font-weight:700;font-size:16px;line-height:1;background:transparent}
.seal.fill{background:var(--c);color:var(--card)}
.seal.sm{width:26px;height:26px;font-size:14px}
.seal.ic svg{width:68%;height:68%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seal.ic.sm svg{stroke-width:2.1}
.cat .seal.ic svg{width:66%;height:66%;stroke-width:1.8}

/* ---------- add form */
.form-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.book{max-width:52%;min-height:34px;padding:4px 8px;font-size:13px;margin-left:auto}
.amountbox{position:relative;margin-top:8px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 14px 8px}
.amt-line{display:flex;align-items:baseline;gap:8px}
.amt-sym{font-family:var(--num);font-size:26px;color:var(--ink-2);min-width:1.4em}
.amt-in{flex:1;min-width:0;border:0;background:transparent;font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:34px;font-weight:500;padding:0;outline:none;color:var(--ink)}
.amt-in::placeholder{color:var(--ink-3)}
.typeplus .amt-in{color:var(--plus)}
.amt-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px -14px 0;padding:6px 14px 0;border-top:1px solid var(--rule-soft);min-height:26px}
.amt-conv{font-family:var(--num);font-size:14px;color:var(--ink-2)}
.curseg button{padding:3px 10px;font-family:var(--num);font-size:13px}
.qsave{flex:none;align-self:center;border:0;background:var(--ink);color:var(--card);font-family:var(--serif);font-size:16px;letter-spacing:.14em;
  height:42px;padding:0 16px;border-radius:var(--r-md)}
.qsave:active{transform:scale(.96)}
.typeplus .qsave{background:var(--plus)}
.stamp{position:absolute;right:104px;top:10px;width:58px;height:58px;border:2.5px solid var(--seal);color:var(--seal);border-radius:6px;
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.05;text-align:center;opacity:0;pointer-events:none;transform:rotate(-9deg)}
.stamp.go{animation:stamp 1.3s ease-out}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-9deg)}18%{opacity:.95;transform:scale(1) rotate(-9deg)}70%{opacity:.9}100%{opacity:0;transform:scale(1) rotate(-9deg)}}
@media (prefers-reduced-motion: reduce){.stamp.go{animation:fade 1.2s linear}@keyframes fade{0%,70%{opacity:.9}100%{opacity:0}}}

.itemfield{margin-top:8px}
.autohint{display:block;line-height:1.6;font-size:12px;color:var(--ink-2);margin-top:4px}
.autohint .seal{display:inline-grid;vertical-align:-5px;margin-right:5px}
.autohint:empty{display:none}
.autohint .seal{width:20px;height:20px;font-size:12px;border-width:1px}
.autohint b{font-weight:600;color:var(--ink)}
.catpanel{margin-top:10px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);padding:2px 10px 8px}
.catpanel>.field:first-child{margin-top:6px}
.catpanel .subwrap{margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}
.subs .chip{background:transparent}
.subs .chip[aria-pressed="true"]{background:transparent;border-color:var(--c);color:var(--c);font-weight:600;box-shadow:inset 0 0 0 1px var(--c)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:2px 4px}
.cat{background:none;border:0;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:var(--r-md);font-size:11px;color:var(--ink-2)}
.cat .seal{width:32px;height:32px;font-size:16px}
.cat[aria-pressed="true"]{color:var(--ink);font-weight:600}
.cat[aria-pressed="true"] .seal{background:var(--c);color:var(--card)}
.datebar{display:flex;gap:6px;align-items:center;min-width:0}
.datebar .input{flex:1;min-width:0;padding:6px 8px;min-height:36px;font-size:14px}
.datebar .chip{padding:4px 9px;font-size:12px}
details.more{margin-top:8px;border-top:1px dashed var(--rule);padding-top:6px}
details.more summary{cursor:pointer;color:var(--ink-2);font-size:13px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
.savebar{margin-top:10px;display:flex;gap:10px}
.savebar .btn{flex:1}
.formerr{color:var(--seal);font-size:13px;min-height:20px;margin-top:8px}
.todaybox{margin-top:22px}
.sum-line{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--rule);padding-bottom:4px;margin-bottom:2px}
.sum-line .num{font-size:18px}
.moderow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.moderow .todaystrip2{flex:1;display:inline-flex;justify-content:flex-end;align-items:baseline;gap:5px;white-space:nowrap}
.modeseg button{padding:7px 16px;font-family:var(--serif);letter-spacing:.08em}
#v-add[data-mode="ai"] #addForm{display:none}
#v-add[data-mode="manual"] .aibox{display:none}
.aibox{margin-bottom:10px}
.aibox .aitext{width:100%;min-height:96px;max-height:200px;resize:none;line-height:1.6;padding:12px 14px;font-size:17px}
.airow{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.aicur{flex:none}
.aicur button{font-family:var(--num);font-size:13px;padding:0 11px;height:42px}
.micbtn{flex:none;width:46px;height:44px;border:1px solid var(--rule);background:var(--card);border-radius:var(--r-md);color:var(--ink-2);display:grid;place-items:center}
.micbtn svg{width:21px;height:21px}
.micbtn.on{color:var(--card);background:var(--seal);border-color:var(--seal);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(184,55,42,.25)}}
.airow .aigo{flex:1;padding:0 14px;font-size:15px;letter-spacing:.2em}
.airow .aigo.busy{opacity:.6}
.aipreview{margin-top:8px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);padding:4px 10px 10px}
.aipreview .ph{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-3);padding:4px 0 2px}
.prow2{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.prow2:last-of-type{border-bottom:0}
.prow2 .bd{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px;color:var(--ink)}
.prow2 .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .m{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .a{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:16px;white-space:nowrap}
.prow2.plus .a{color:var(--plus)}
.prow2 .x{background:none;border:0;color:var(--ink-3);font-size:18px;padding:0 2px;line-height:1}
.aipreview .pact{display:flex;gap:8px;margin-top:8px;align-items:center}
.aipreview .pact .btn{flex:1;padding:9px 12px;font-size:14px}
.aipreview .pact .linkbtn{flex:none}
.monthstrip{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0}
.todaystrip{flex:1;display:inline-flex;justify-content:center;align-items:baseline;gap:5px;white-space:nowrap}
.monthstrip b{font-family:var(--num);font-weight:600;color:var(--ink);font-size:15px}

/* ---------- ledger rows */
.rec{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule-soft);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rec .body{flex:1;min-width:0}
.rec .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .m{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .tag{display:inline-block;border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-right:4px;font-size:11px;color:var(--ink-2)}
.rec .tag.prj{border-color:var(--seal);color:var(--seal)}
.rec .a{text-align:right;flex:none;padding-left:10px;border-left:1px solid var(--rule-soft)}
.rec .a .v{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:17px;white-space:nowrap}
.rec .a .o{font-family:var(--num);font-size:12px;color:var(--ink-3);white-space:nowrap}
.rec.plus .a .v{color:var(--plus)}
.month{margin-top:18px}
.month h3{font-family:var(--serif);font-size:16px;font-weight:700;margin:0;letter-spacing:.05em}
.month .sum-line{border-bottom-color:var(--ink-2)}
.month .tot{font-size:12px;color:var(--ink-2);text-align:right}
.month .tot .num{font-size:16px;color:var(--ink)}
.filters{display:grid;gap:8px;position:sticky;top:58px;z-index:5;background:var(--paper);padding:6px 0 8px}
.filters .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.filters select.input{min-height:36px;padding:5px 8px;font-size:13px}
.empty{padding:28px 6px;color:var(--ink-2);text-align:center}

/* ---------- stats */
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrl select.input{width:auto;min-height:36px;padding:5px 10px;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding:4px 8px;border:1px solid var(--rule);border-radius:999px;background:var(--card)}
.toggle input{accent-color:var(--ink);margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.kpi{padding:12px 10px 10px;border-bottom:1px solid var(--rule-soft)}
.kpi:nth-child(odd){border-right:1px solid var(--rule-soft)}
.kpi:nth-last-child(-n+2){border-bottom:0}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:24px;font-weight:500;line-height:1.25}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.hero{grid-column:1/-1;border-right:0!important;text-align:center;padding:16px 10px 14px}
.kpi.hero .v{font-size:40px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi{border-right:1px solid var(--rule-soft)}.kpi:nth-child(4n+1){border-right:1px solid var(--rule-soft)}.kpi:nth-last-child(-n+4){border-bottom:0}.kpi.hero{border-bottom:1px solid var(--rule-soft)!important}}
.sec{margin-top:26px}
.sec h3{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 0 8px;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 .seg{font-family:var(--sans)}
.chartwrap{display:flex;background:var(--card);border:1px solid var(--rule-soft);border-radius:var(--r-md);padding:8px 4px 4px}
.chartwrap .axis{flex:none}
.chartwrap .scroll{flex:1;overflow-x:auto;min-width:0}
.chartinfo{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 6px;min-height:22px}
.chartinfo b{font-family:var(--num);color:var(--ink);font-weight:600;font-size:15px}
.chartinfo .p b{color:var(--plus)}
svg text{font-family:var(--num);fill:var(--ink-3);font-size:11px}
.bars .bar{cursor:pointer}
.catrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule-soft);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.catrow .nm{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.catrow .nm span:last-child{color:var(--ink-3);font-size:12px}
.catrow .track{height:6px;background:var(--rule-soft);border-radius:3px;margin-top:4px;overflow:hidden}
.catrow .track i{display:block;height:100%;background:var(--c)}
.bud .btotal{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px}
.bud .btotal .big{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:38px;font-weight:500;line-height:1.15;margin:2px 0 4px}
.bud .bt-stats{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.bud .bt-stats div{flex:1}
.bud .bt-stats span{display:block;font-size:12px;color:var(--ink-3)}
.bud .bt-stats b{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:20px;font-weight:500}
.bud .bt-stats .o b{color:var(--seal)}
.bdetail{margin-top:16px}
.bd-h{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule-soft);padding-bottom:4px;margin-bottom:2px}
.bd-h span{font-size:11px;color:var(--ink-3)}
.brow{display:grid;grid-template-columns:4.2em 1fr 12.4em;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.brow .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bbar{height:5px;margin-top:0}
.brow .bbar b{top:-2px;bottom:-2px;width:1.5px}
.brow .v{font-family:var(--num);font-feature-settings:"lnum" 1,"tnum" 1;font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:right}
.brow .v small{color:var(--ink-3);font-size:12px}
.brow em{font-style:normal;font-family:var(--sans);font-size:11px;margin-left:5px;padding:0 4px;border-radius:3px}
.brow em.over{color:var(--card);background:var(--seal)}.brow em.warn{color:#8A6420;background:rgba(184,134,46,.16)}
.bud .btotal .big small{font-size:16px;color:var(--ink-3)}

<script>
/* =====================================================================
 *  API layer — PWA 本地優先：先寫手機、背景同步到試算表
 * ===================================================================== */
const HAS_GAS = false;
const LS = {
  get(k, d){ try { const v = localStorage.getItem('ledger.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ledger.' + k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem('ledger.' + k); } catch(e){} },
};
const Net = {
  cfg: LS.get('cfg', null),          // {url, token}
  cache: LS.get('cache', null),      // {rev, records, categories, projects, rates, settings, templates, budgets}
  outbox: LS.get('outbox', []),      // [{fn, args}]
  lastSync: LS.get('lastSync', ''),
  syncing: false, lastErr: '', timer: null, booted: false,
};
/* 畫面上的 S.records 就是快取本身（同一個陣列）；存檔前先對齊 */
const saveCache = () => { if (!Net.cache) return; if (Net.booted && Array.isArray(S.records)) Net.cache.records = S.records; LS.set('cache', Net.cache); };
let persistT; const persistSoon = () => { clearTimeout(persistT); persistT = setTimeout(saveCache, 60); };
const saveOutbox = () => LS.set('outbox', Net.outbox);
const nowStr = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const newLocalId = () => ('L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).toUpperCase().replace(/[^0-9A-Z]/g, 'X').slice(0, 18);

/* 直接打 Apps Script：POST 純文字 JSON（不觸發預檢），回 {ok, result, rev} */
async function api(fn, args, timeoutMs){
  if (!Net.cfg || !Net.cfg.url) throw new Error('還沒設定連線');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs || 45000);
  let res;
  try {
    res = await fetch(Net.cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal: ctl.signal,
      body: JSON.stringify({ token: Net.cfg.token, fn, args: args || [] }) });
  } catch(e){ throw new Error(e.name === 'AbortError' ? '連線逾時' : '連不上試算表（' + (navigator.onLine ? '網路或 Google 暫時有問題' : '目前離線') + '）'); }
  finally { clearTimeout(t); }
  let j; try { j = await res.json(); } catch(e){ throw new Error('試算表回應不正確（HTTP ' + res.status + '）'); }
  if (!j.ok){ if (j.error === 'unauthorized') throw new Error('密鑰不正確或已更換，請到設定重新輸入'); throw new Error(j.error || '未知錯誤'); }
  return j;
}

/* 伺服器版本剛好比我們多 1 → 只有我們這次的變動；否則保留舊版本號，下次同步會整份重拉 */
function adoptRev(rev){ if (Net.cache && rev === Net.cache.rev + 1) Net.cache.rev = rev; else if (Net.cache && rev !== Net.cache.rev) scheduleSync(1500); }

/* ---------- 本地資料操作 */
function upsertLocal(rec){ const R = Net.cache.records, i = R.findIndex(r => r.id === rec.id); if (i >= 0) R[i] = rec; else R.push(rec); }
function enqueue(op){
  // 同一筆的多次修改合併成一個操作；新增後又修改＝新增最後版本
  if (op.fn === 'api_updateRecord' || op.fn === 'api_addRecord'){
    const id = op.args[0].id;
    const j = Net.outbox.findIndex(o => (o.fn === 'api_addRecord' || o.fn === 'api_updateRecord') && o.args[0].id === id);
    if (j >= 0){ Net.outbox[j] = { fn: Net.outbox[j].fn === 'api_addRecord' ? 'api_addRecord' : op.fn, args: op.args }; saveOutbox(); scheduleSync(); return; }
  }
  if (op.fn === 'api_deleteRecord'){
    const id = op.args[0];
    const j = Net.outbox.findIndex(o => o.fn === 'api_addRecord' && o.args[0].id === id);
    Net.outbox = Net.outbox.filter(o => !((o.fn === 'api_addRecord' || o.fn === 'api_updateRecord') && o.args[0].id === id));
    if (j >= 0){ saveOutbox(); scheduleSync(); return; }   // 還沒送出去就刪了：什麼都不用送
  }
  Net.outbox.push(op); saveOutbox(); scheduleSync();
}
function scheduleSync(delay){ clearTimeout(Net.timer); Net.timer = setTimeout(() => { saveCache(); sync(); }, delay == null ? 400 : delay); paintSync(); }

/* ---------- 同步：先把排隊的寫入送出，再看試算表有沒有別的變動 */
async function sync(force){
  if (!Net.cfg || Net.syncing) return;
  Net.syncing = true; paintSync();
  try {
    while (Net.outbox.length){
      const op = Net.outbox[0];
      const j = await api(op.fn, op.args);
      Net.outbox.shift(); saveOutbox();
      if (Net.cache && j.rev === Net.cache.rev + 1) Net.cache.rev = j.rev;   // 只有我們這筆變動，不用整份重拉
      paintSync();
    }
    const j = await api('api_pull', [force || !Net.cache ? 0 : Net.cache.rev]);
    if (j.result.changed) applyPull(j.result.data, j.rev);
    else if (Net.cache) Net.cache.rev = j.rev;
    saveCache();
    Net.lastSync = nowStr(); LS.set('lastSync', Net.lastSync); Net.lastErr = '';
  } catch(e){ Net.lastErr = e.message || String(e); }
  finally { Net.syncing = false; paintSync(); }
}
function applyPull(data, rev){
  Net.cache = { rev, records: data.records || [], categories: data.categories || [], projects: data.projects || [], rates: data.rates || [],
    settings: data.settings || {}, templates: data.templates || [], budgets: data.budgets || [] };
  // 拉取期間若又記了新的，把還沒送出的重新疊回去
  Net.outbox.forEach(o => { if (o.fn === 'api_addRecord' || o.fn === 'api_updateRecord') upsertLocal(o.args[0]); if (o.fn === 'api_deleteRecord') Net.cache.records = Net.cache.records.filter(r => r.id !== o.args[0]); });
  if (Net.booted){ applyData(Net.cache); render(); }   // 先換成新資料，再存檔（saveCache 以畫面上的 S.records 為準）
  saveCache();
}

/* ---------- 給既有介面用的 call()：記帳三個動作立即完成，其餘需要連線 */
const Mock = {};   // （舊版測試用，PWA 不需要）
async function call(fn, ...args){
  switch (fn){
    case 'api_bootstrap': {
      const fresh = !!args[0];
      if (!fresh && Net.cache){ scheduleSync(300); return { ...Net.cache, today: localToday() }; }
      await sync(true);
      if (!Net.cache) throw new Error(Net.lastErr || '連不上試算表');
      return { ...Net.cache, today: localToday() };
    }
    // 記帳三個動作：介面已經先改了畫面上的 S.records，這裡只負責排隊送出與存檔
    case 'api_addRecord': { const r = { ...args[0], id: newLocalId(), created: nowStr(), src: 'App' }; enqueue({ fn, args: [r] }); persistSoon(); return r; }
    case 'api_updateRecord': { const old = (S.records || []).find(x => x.id === args[0].id) || {}; const r = { ...old, ...args[0] }; enqueue({ fn, args: [r] }); persistSoon(); return r; }
    case 'api_deleteRecord': { enqueue({ fn, args: [args[0]] }); persistSoon(); return args[0]; }
    case 'api_saveProject': { const j = await api(fn, args); Net.cache.projects = j.result; if (args[1] && args[1] !== args[0].name) (S.records || []).forEach(r => { if (r.project === args[1]) r.project = args[0].name; }); adoptRev(j.rev); saveCache(); return j.result; }
    case 'api_saveBudget': { const j = await api(fn, args); Net.cache.budgets = j.result; adoptRev(j.rev); saveCache(); return j.result; }
    case 'api_saveSettings': { const j = await api(fn, args); Net.cache.settings = j.result; adoptRev(j.rev); saveCache(); return j.result; }
    case 'api_refreshRates': { const j = await api(fn, args); Net.cache.rates = j.result.rates; Net.cache.settings = j.result.settings; adoptRev(j.rev); saveCache(); return j.result; }
    case 'api_ask': { const j = await api(fn, args, 120000); return j.result; }
    case 'api_parse': { const j = await api(fn, args, 60000); return j.result; }
    case 'api_digest': case 'api_categories': case 'api_whoami': case 'api_ping': { const j = await api(fn, args); return j.result; }
    default: throw new Error('未知的功能 ' + fn);
  }
}

/* ---------- 同步狀態（標題下的小字） */
function paintSync(){
  const el = document.querySelector('.brand small'); if (!el) return;
  const n = Net.outbox.length;
  let t = 'Personal Ledger', cls = '';
  if (!Net.cfg) t = '尚未連線';
  else if (Net.cfg.scope === 'agent' && !Net.syncing && !n && !Net.lastErr) t = 'Agent 受限模式';
  else if (Net.syncing) { t = n ? `同步中…（${n} 筆）` : '同步中…'; cls = 'busy'; }
  else if (n) { t = `${n} 筆待同步`; cls = 'pending'; }
  else if (Net.lastErr) { t = navigator.onLine ? '同步失敗，稍後再試' : '離線，連線後自動同步'; cls = 'pending'; }
  el.textContent = t; el.className = cls;
}

/* ---------- 首次設定：輸入 Apps Script 網址與密鑰 */
function openConnect(first){
  const html = `<h3>連線到你的試算表</h3>
    <p class="tiny muted" style="margin:4px 0 10px">在 Apps Script 部署成網頁應用程式後，把網址貼進來；密鑰在試算表 Settings 分頁的「API密鑰」。只會存在這支手機上。</p>
    <div class="field"><label>Apps Script 網址</label><input class="input" id="cfgUrl" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(Net.cfg ? Net.cfg.url : '')}"></div>
    <div class="field"><label>密鑰</label><input class="input" id="cfgTok" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="40 個字" value="${esc(Net.cfg ? Net.cfg.token : '')}"></div>
    <div class="formerr" id="cfgErr"></div>
    <div class="savebar">${first ? '' : '<button class="btn ghost" id="cfgCancel">取消</button>'}<button class="btn" id="cfgGo">連線</button></div>`;
  const mount = body => {
    const go = async () => {
      const url = $('#cfgUrl', body).value.trim(), token = $('#cfgTok', body).value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){ $('#cfgErr', body).textContent = '網址應該長這樣：https://script.google.com/macros/s/…/exec'; return; }
      if (token.length < 20){ $('#cfgErr', body).textContent = '密鑰太短，請從 Settings 分頁完整複製'; return; }
      $('#cfgGo', body).disabled = true; $('#cfgErr', body).textContent = '連線中…';
      const prev = Net.cfg; Net.cfg = { url, token };
      try { const w = await api('api_whoami', [], 20000); Net.cfg.scope = (w.result && w.result.scope) || 'full'; LS.set('cfg', Net.cfg);
        if (prev && prev.url !== url){ Net.cache = null; LS.del('cache'); }
        if (!first) closeSheet(); toast(Net.cfg.scope === 'agent' ? '已連線（Agent 受限模式）' : '已連線'); boot(true); }
      catch(e){ Net.cfg = prev; $('#cfgGo', body).disabled = false; $('#cfgErr', body).textContent = e.message || String(e); }
    };

    const c = $('#cfgCancel', body); if (c) c.onclick = closeSheet;
    $('#cfgTok', body).onkeydown = e => { if (e.key === 'Enter') go(); };
  };
  if (first){ const box = $('#loading'); box.hidden = false; box.className = 'setupbox'; box.innerHTML = html; mount(box); }
  else openSheet(html, mount);
}

/* ---------- 連結自動連線：#api=<部署ID>&key=<密鑰>（給 AI Agent 用，打開就連上） */
(function autoConnectFromHash(){
  const m = location.hash.match(/^#(.+)$/); if (!m) return;
  const q = new URLSearchParams(m[1]); const id = q.get('api'), key = q.get('key'), url = q.get('url');
  const u = url || (id ? `https://script.google.com/macros/s/${id}/exec` : '');
  if (!u || !key) return;
  history.replaceState(null, '', location.pathname + location.search);   // 立刻把密鑰從網址列拿掉
  Net.pendingCfg = { url: u, token: key };
})();
async function applyPendingCfg(){
  const c = Net.pendingCfg; Net.pendingCfg = null; if (!c) return false;
  const prev = Net.cfg; Net.cfg = c;
  try { const w = await api('api_whoami', [], 20000); Net.cfg.scope = (w.result && w.result.scope) || 'full'; LS.set('cfg', Net.cfg);
    if (!prev || prev.url !== c.url || prev.token !== c.token){ Net.cache = null; LS.del('cache'); Net.outbox = []; saveOutbox(); } return true; }
  catch(e){ Net.cfg = prev; toast('連結裡的密鑰無法連線：' + (e.message || e), { err: true }); return false; }
}

/* ---------- Service worker：App 殼快取在手機裡；剛打開時發現新版就直接換，用到一半才提示 */
const APP_START = Date.now();
function userBusy(){ const a = document.querySelector('#v-add .amt-in'), t = document.querySelector('.aitext'); return !!((a && a.value) || (t && t.value) || document.querySelector('#sheet.on')); }
function offerUpdate(w){
  if (!w) return;
  if (Date.now() - APP_START < 6000 && !userBusy()){ w.postMessage('skipWaiting'); return; }   // 剛打開、還沒操作：直接換
  toast('記帳本有新版本', { action: '更新', onAction: () => w.postMessage('skipWaiting') });
}
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(w); });
    });
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });   // 從背景回來也檢查
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded){ reloaded = true; location.reload(); } });
}

const WEEK = '日一二三四五六';

function monthsBetween(a, b){ const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }
function daysBetween(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
function lastDay(m){ const [y, mo] = m.split('-').map(Number); return m + '-' + String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2, '0'); }
function shiftDay(d, n){ const t = new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5); return t.toISOString().slice(0, 10); }
function weekday(d){ return WEEK[new Date(d + 'T00:00:00Z').getUTCDay()]; }
const ZH_MONTH = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

/* ---------- rates & conversion */
let RATE = {}, RATE_KEYS = [], LATEST = {CNY:7, TWD:31, USD:1};
function buildRates(){
  RATE = {}; S.rates.forEach(r => RATE[r.m] = {CNY:+r.CNY, TWD:+r.TWD, USD:1});
  RATE_KEYS = Object.keys(RATE).sort();
  const last = RATE[RATE_KEYS[RATE_KEYS.length - 1]] || LATEST;
  LATEST = {CNY:+S.settings['最新CNY'] || last.CNY, TWD:+S.settings['最新TWD'] || last.TWD, USD:1};
}
function rateFor(m){
  if (RATE[m]) return RATE[m];
  if (!RATE_KEYS.length) return LATEST;
  if (m < RATE_KEYS[0]) return RATE[RATE_KEYS[0]];
  for (let i = RATE_KEYS.length - 1; i >= 0; i--) if (RATE_KEYS[i] <= m) return RATE[RATE_KEYS[i]];
  return LATEST;
}
function conv(amount, cur, date, to){
  if (cur === to) return amount;
  const r = S.settings['換算方式'] === '最新匯率' ? LATEST : (ym(date) >= RATE_KEYS[RATE_KEYS.length - 1] && !RATE[ym(date)] ? LATEST : rateFor(ym(date)));
  return amount / r[cur] * r[to];
}
const val = (rec, to = S.disp) => conv(rec.amount, rec.cur, rec.date, to);

/* ---------- number formatting */
function fmt(n, cur = S.disp, {dec, sign} = {}){
  const d = dec != null ? dec : (Math.abs(n) < 100 && n % 1 ? 2 : 0);
  const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  return (n < 0 ? '−' : (sign && n > 0 ? '+' : '')) + SYM[cur] + '\u00a0' + s;
}
function compact(n, cur = S.disp){
  const a = Math.abs(n);
  if (cur === 'USD') return (a >= 1000 ? (n / 1000).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k' : Math.round(n) + '');
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '萬';
  return Math.round(n) + '';
}
function parseAmount(s){
  s = String(s || '').replace(/[０-９．＋－＊／]/g, c => '0123456789.+-*/'['０１２３４５６７８９．＋－＊／'.indexOf(c)]).replace(/[,\s]/g, '');
  if (!s) return NaN;
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  try { const v = Function('"use strict";return (' + s + ')')(); return isFinite(v) ? Math.round(v * 100) / 100 : NaN; } catch(e){ return NaN; }
}

/* ---------- 每月固定項目 */
function shiftMonthText(s, diff){
  if (!diff) return s;
  const sh = n => (((n - 1 + diff) % 12) + 12) % 12 + 1;
  s = s.replace(/(十二|十一|十|[一二三四五六七八九])月/, (m0, c) => ZH_MONTH[sh(ZH_MONTH.indexOf(c) + 1) - 1] + '月');
  return s.replace(/(^|[^\d.])(\d{1,2})\/(\d{1,2})(?![\d.])/g, (m0, pre, a, b) => (+a >= 1 && +a <= 12) ? pre + sh(+a) + '/' + b : m0);
}
function tplPlan(t){
  const m = ym(S.today), mo = +m.slice(5);
  const hits = S.records.filter(r => !r.project && r.type === t.type && String(r.item).includes(t.key)).sort(byNewest);
  const last = hits[0];
  const dd = Math.min(t.day || 1, +lastDay(m).slice(8));
  let date = m + '-' + String(dd).padStart(2, '0'); if (date > S.today) date = S.today;
  const item = last ? shiftMonthText(last.item, monthsBetween(ym(last.date), m))
    : t.item.replace(/\{月\}/g, ZH_MONTH[mo - 1] + '月').replace(/\{M\+1\}/g, mo % 12 + 1).replace(/\{M\}/g, mo);
  return {item, amount: last ? last.amount : t.amount, cur: last ? last.cur : t.cur, cat: t.cat, sub: t.sub, date,
          done: hits.some(r => ym(r.date) === m)};

const normItem = t => String(t || '').toLowerCase().replace(/[\s\d.,，。、:：;；\-—_/\\()（）\[\]【】+＋=~～!！?？'"“”‘’]+/g, '');
/* 依當下時間判斷是哪一餐：10:30 前早餐、15:00 前午餐、之後晚餐 */
function mealByTime(){ const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? '早餐' : h < 15 ? '午餐' : '晚餐'; }
function suggestCat(text, type){
  const raw = String(text || '').trim(), n = normItem(raw);
  if (!n) return null;
  const ok = (c, s) => S.cats.some(x => x.name === c && x.type === type && x.active) ? {cat:c, sub:s} : null;
  const mine = S.records.filter(r => !r.project && r.type === type && r.item && r.cat !== '日常彙總')
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  // 1) 跟你以前記過的項目一模一樣
  let hit = mine.find(r => normItem(r.item) === n);
  if (hit && ok(hit.cat, hit.sub)) return {cat:hit.cat, sub:hit.sub, src:'mine'};
  // 2) 輸入內容包含以前記過的項目（至少兩個字）
  hit = mine.map(r => ({r, k:normItem(r.item)})).filter(x => x.k.length >= 2 && n.includes(x.k)).sort((a, b) => b.k.length - a.k.length)[0];
  if (hit && ok(hit.r.cat, hit.r.sub)) return {cat:hit.r.cat, sub:hit.r.sub, src:'mine'};
  // 3) 內建關鍵字
  for (const [re, c, s, tag] of (CAT_RULES[type] || [])) if (re.test(raw)){ const sub = s === 'MEAL' ? mealByTime() : s; const o = ok(c, sub); if (o) return {...o, src:'rule', tag}; }
  // 4) 以前記過的項目開頭跟輸入一樣（輸入至少兩個字）
  if (n.length >= 2){ hit = mine.find(r => normItem(r.item).startsWith(n)); if (hit && ok(hit.cat, hit.sub)) return {cat:hit.cat, sub:hit.sub, src:'mine'}; }
  return null;
}

/* =====================================================================
 *  AI 記帳：一句話 → 多筆紀錄；先用本機規則，解析不完整再問 AI

const CN_NUM = {零:0,一:1,二:2,兩:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,百:100,千:1000};
function cnToNum(t){   // 八十五 → 85；兩百三 → 230（粗略）
  if (!/^[零一二兩两三四五六七八九十百千]+$/.test(t)) return NaN;
  let total = 0, sec = 0, num = 0;
  for (const ch of t){ const v = CN_NUM[ch];
    if (v < 10) num = v; else if (v === 10){ sec += (num || 1) * 10; num = 0; } else { sec += (num || 1) * v; num = 0; } }
  total = sec + num; if (/^[一二兩两三四五六七八九]?[百千]\D$/.test(t)) total = sec; return total;
}
const DATE_WORDS = [[/大前天/, -3], [/前天/, -2], [/昨天|昨日/, -1], [/今天|今日/, 0]];
function parseLocal(text){
  // 「皮皮蝦$8燉雞$9」這種沒有分隔符的：在「金額（含單位）」後面接著中文字時切開
  const pre = String(text || '').replace(/(\d+(?:\.\d+)?\s*(?:塊錢|塊|元|rmb|¥|\$)?)\s*(?![塊元錢])(?=[\u4e00-\u9fff]{1,}(?:[^\d]*\$?\d))/g, '$1，');
  const segs = pre.split(/[，,、；;\n]|\s+(?:和|還有|跟|以及)\s+|(?<=\d)\s*(?:和|還有|跟)\s*/).map(x => x.trim()).filter(Boolean);
  const out = [];
  for (let seg of segs){
    let date = S.today;
    for (const [re, d] of DATE_WORDS) if (re.test(seg)){ date = shiftDay(S.today, d); seg = seg.replace(re, ' '); break; }
    const md = seg.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*[日號]?/); if (md && +md[1] <= 12 && +md[2] <= 31){ date = S.today.slice(0, 4) + '-' + String(+md[1]).padStart(2, '0') + '-' + String(+md[2]).padStart(2, '0'); seg = seg.replace(md[0], ' '); }
    let cur = 'CNY';
    if (/台幣|臺幣|NT\$?|TWD/i.test(seg)) cur = 'TWD'; else if (/美金|美元|USD|US\$/i.test(seg)) cur = 'USD';   // 單獨的 $ 當人民幣（上海鍵盤常打成 $）
    let amount = NaN, m = seg.match(/(\d+(?:\.\d+)?)\s*(?:塊錢|塊|元|rmb|人民幣|台幣|臺幣|美金|美元|usd|twd|cny|nt\$?|¥|\$)?/i);
    if (m){ amount = parseFloat(m[1]); seg = seg.replace(m[0], ' '); }
    else { const c = seg.match(/([零一二兩两三四五六七八九十百千]{1,6})\s*(?:塊錢|塊|元)/); if (c){ amount = cnToNum(c[1]); seg = seg.replace(c[0], ' '); } }
    const type = /退款|退回|報銷|报销|返現|返现|補貼|补贴|給我|给我|收到/.test(seg) ? '補貼' : '支出';
    let item = seg.replace(/人民幣|台幣|臺幣|美金|美元|rmb|usd|twd|cny|nt\$?|¥|\$|花了|花費|買了|买了|付了|用了|的|了/gi, ' ').replace(/\s+/g, ' ').trim();
    const sg = item ? suggestCat(item, type) : null;
    out.push({ date, type, cat: sg ? sg.cat : '', sub: sg ? sg.sub : '', item, amount, cur, tags: sg && sg.tag ? sg.tag : '', note: '', project: '', spread: 1, raw: seg });
  }
  return out;
}

/* =====================================================================
 *  Stats engine
 * ===================================================================== */
function portions(r, spread){
  const v = val(r), n = spread ? Math.max(1, r.spread || 1) : 1, m0 = ym(r.date);
  const out = []; for (let i = 0; i < n; i++) out.push({m: addMonths(m0, i), v: v / n});
  return out;
}
function rangeDef(key){
  const nowM = ym(S.today), start0 = S.settings['統計起始日'] || '2017-03-27';
  const firstM = S.records.length ? S.records.reduce((a, r) => r.date < a ? r.date : a, '9999').slice(0, 7) : nowM;
  if (key === 'all') return {a: firstM < ym(start0) ? firstM : ym(start0), b: nowM, d0: start0, label:'全部'};
  if (key === '12m') return {a: addMonths(nowM, -11), b: nowM, d0: addMonths(nowM, -11) + '-01', label:'近 12 個月'};
  const y = key; return {a: y + '-01', b: y + '-12', d0: y + '-01-01', label: y + ' 年'};
}
function computeStats(){
  const st = S.stats, R = rangeDef(st.range), nowM = ym(S.today);
  const recs = S.records.filter(r => st.withPrj || !r.project);
  const months = {}; const cats = {}; const years = {};
  let exp = 0, sub = 0, nExp = 0;
  const top = [];
  recs.forEach(r => {
    portions(r, st.spread).forEach(p => {
      if (p.m < R.a || p.m > R.b || p.m > nowM) return;   // 攤提到未來月份的部分還沒發生，不算
      const mm = months[p.m] || (months[p.m] = {e:0, s:0});
      const yy = years[p.m.slice(0, 4)] || (years[p.m.slice(0, 4)] = {e:0, s:0});
      if (r.type === '補貼'){ sub += p.v; mm.s += p.v; yy.s += p.v; }
      else {
        exp += p.v; mm.e += p.v; yy.e += p.v;
        const key = r.project ? '專項：' + r.project : r.cat;
        const c = cats[key] || (cats[key] = {v:0, n:0, info: r.project ? {seal:'專', color:'var(--seal)'} : catInfo(r), cat: r.project ? '' : r.cat});
        c.v += p.v;
      }
    });
    const m = ym(r.date);
    if (m >= R.a && m <= R.b && r.type !== '補貼'){ top.push(r); nExp++; }
  });
  const end = S.today < lastDay(R.b) ? S.today : lastDay(R.b);
  const start = R.d0 > R.a + '-01' ? R.d0 : R.a + '-01';
  const days = Math.max(1, daysBetween(start, end) + 1);
  top.sort((a, b) => val(b) - val(a));
  return {R, exp, sub, net: exp - sub, days, months, cats, years, top: top.slice(0, 10), nExp, start, end};
}
function yearDays(y){
  const s0 = S.settings['統計起始日'] || '2017-03-27';
  const a = (y + '-01-01') > s0 ? y + '-01-01' : s0, b = (y + '-12-31') < S.today ? y + '-12-31' : S.today;
  return Math.max(1, daysBetween(a, b) + 1);
}

function drawChart(X){
  const st = S.stats, wrap = $('#cwrap');
  let keys, data;
  if (st.gran === 'y'){
    keys = Object.keys(X.years).sort(); data = keys.map(k => X.years[k]);
  } else {
    const n = monthsBetween(X.R.a, X.R.b) + 1; keys = []; for (let i = 0; i < n; i++) keys.push(addMonths(X.R.a, i));
    keys = keys.filter(k => k <= ym(S.today)); data = keys.map(k => X.months[k] || {e:0, s:0});
  }
  if (!keys.length){ wrap.innerHTML = '<div class="empty">沒有資料</div>'; return; }
  const H = 190, padT = 10, padB = 22, axisW = 38;
  const maxE = Math.max(1, ...data.map(d => d.e)), maxS = Math.max(0, ...data.map(d => d.s));
  const total = maxE + maxS, plotH = H - padT - padB;
  const zeroY = padT + plotH * (maxE / total);
  const sc = plotH / total;
  const avail = wrap.clientWidth - axisW - 26;
  const step = Math.max(st.gran === 'y' ? 26 : 16, avail / keys.length);
  const bw = Math.min(st.gran === 'y' ? 34 : 14, step * 0.64);
  const W = step * keys.length + 6;
  const ticks = niceTicks(maxE);
  let ax = `<svg class="axis" width="${axisW}" height="${H}" aria-hidden="true">`;
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="支出長條圖">`;
  ticks.forEach(t => { const y = zeroY - t * sc; svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--rule-soft)"/>`; ax += `<text x="${axisW - 5}" y="${y + 4}" text-anchor="end">${compact(t)}</text>`; });
  if (maxS > 0) ax += `<text x="${axisW - 5}" y="${zeroY + maxS * sc}" text-anchor="end">−${compact(maxS)}</text>`;
  ax += '</svg>';
  svg += `<line x1="0" x2="${W}" y1="${zeroY}" y2="${zeroY}" stroke="var(--ink-2)"/>`;
  svg += '<g class="bars">';
  keys.forEach((k, i) => {
    const x = i * step + (step - bw) / 2, d = data[i];

    if (he > 0) svg += `<rect x="${x}" y="${zeroY - he}" width="${bw}" height="${he}" fill="var(--ink)" rx="1"/>`;
    if (hs > 0) svg += `<rect x="${x}" y="${zeroY}" width="${bw}" height="${hs}" fill="var(--plus)" rx="1"/>`;
    svg += '</g>';
    const label = st.gran === 'y' ? k : (k.endsWith('-01') ? k.slice(0, 4) : (keys.length <= 14 ? +k.slice(5) + '月' : ''));
    if (label) svg += `<text x="${x + (keys.length > 14 && st.gran === 'm' ? 0 : bw / 2)}" y="${H - 6}" text-anchor="${keys.length > 14 && st.gran === 'm' ? 'start' : 'middle'}">${label}</text>`;
  });
  svg += '</g></svg>';
  wrap.innerHTML = ax + `<div class="scroll">${svg}</div>`;
  const sc2 = $('.scroll', wrap); sc2.scrollLeft = sc2.scrollWidth;
  const info = i => {
    const k = keys[i], d = data[i];
    $('#cinfo').innerHTML = `<span>${st.gran === 'y' ? k + ' 年' : k.slice(0, 4) + ' 年 ' + (+k.slice(5)) + ' 月'}</span><span>支出 <b>${fmt(d.e)}</b></span>${d.s ? `<span class="p">補貼 <b>${fmt(d.s)}</b></span><span>淨額 <b>${fmt(d.e - d.s)}</b></span>` : ''}`;
    $$('.bar', wrap).forEach(g => g.style.opacity = +g.dataset.i === i ? 1 : .55);
  };
  $$('.bar', wrap).forEach(g => g.addEventListener('click', () => info(+g.dataset.i)));

}
function niceTicks(max){
  const raw = max / 3, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  const out = []; for (let t = step; t <= max * 1.001; t += step) out.push(t); return out;
}

S.bud = {view:'y'};
const budTokens = map => String(map || '').split(/[,，、]/).map(t => t.trim()).filter(Boolean)
  .map(t => t === '*' ? {all:true} : {cat:t.split('/')[0].trim(), sub:(t.split('/')[1] || '').trim()});
function budLinesFor(year){ return S.budgets.filter(b => b.year === String(year)).map(b => ({...b, tokens:budTokens(b.map)})); }
/* 一筆支出歸到哪個預算項目：標籤指定 > 分類/子分類 > 整個分類 > 其他未對應(*) */
function budLineOf(r, lines){
  const tags = String(r.tags || '').split(/[,，\s]+/).filter(Boolean);
  let l = lines.find(x => tags.includes(x.name)); if (l) return l;
  l = lines.find(x => x.tokens.some(t => t.cat === r.cat && t.sub && t.sub === r.sub)); if (l) return l;
  l = lines.find(x => x.tokens.some(t => t.cat === r.cat && !t.sub)); if (l) return l;
  return lines.find(x => x.tokens.some(t => t.all)) || null;
}
function budTarget(){ return /^\d{4}$/.test(S.stats.range) ? S.stats.range : S.today.slice(0, 4); }
function computeBudget(year, view){
  const lines = budLinesFor(year); if (!lines.length) return null;
  const curY = S.today.slice(0, 4), curM = ym(S.today);
  const inRange = m => view === 'm' ? m === curM : (m.slice(0, 4) === String(year) && m <= curM);
  const act = new Map(lines.map(l => [l, 0])); let none = 0, sub = 0, hist = 0;
  S.records.forEach(r => {
    if (r.project) return;
    portions(r, S.stats.spread).forEach(p => {
      if (!inRange(p.m)) return;
      if (r.type === '補貼'){ sub += p.v; return; }
      if (r.cat === '日常彙總'){ hist += p.v; return; }   // 以前按月合併的日常開銷：不分到細項，只算進生活費小計
      const l = budLineOf(r, lines); if (l) act.set(l, act.get(l) + p.v); else none += p.v;
    });
  });
  const toDisp = (amt, cur) => conv(amt, cur || 'CNY', S.today, S.disp);
  let pace;
  if (view === 'm'){ pace = +S.today.slice(8) / +lastDay(curM).slice(8); }
  else if (String(year) < curY) pace = 1; else if (String(year) > curY) pace = 0;
  else { const a = year + '-01-01', b = year + '-12-31'; pace = (daysBetween(a, S.today) + 1) / (daysBetween(a, b) + 1); }
  const live = pace > 0 && pace < 1;
  const rows = lines.filter(l => view === 'y' || l.period === '月').map(l => {
    const budget = toDisp(view === 'y' && l.period === '月' ? l.amount * 12 : l.amount, l.cur), actual = act.get(l);
    // 固定開銷：月視圖不看時間進度；年視圖按「已過的月份」算應付多少
    const expected = !live ? null : l.fixed ? (view === 'm' ? null : budget * (+S.today.slice(5, 7) / 12)) : budget * pace;
    return {l, budget, actual, expected};
  });
  const sumExp = xs => live ? xs.reduce((a, x) => a + (x.expected == null ? Math.min(x.actual, x.budget) : x.expected), 0) : null;
  const skipped = lines.filter(l => view === 'm' && l.period === '年');
  const tb = rows.reduce((a, x) => a + x.budget, 0), ta = rows.reduce((a, x) => a + x.actual, 0) + hist;
  const histGroup = (lines.find(l => l.tokens.some(t => t.all)) || lines.find(l => l.period === '月') || lines[0]);
  const te = live ? sumExp(rows) : null;
  return {rows, skipped, pace, tb, ta, te, sumExp, none, sub, hist, histGroup: histGroup.group || histGroup.name};
}
/* expected＝照時間「應該花到」的金額；固定開銷沒有 expected（月初一次付清屬正常） */
function budStatus(actual, budget, expected){
  if (budget <= 0) return actual > 0 ? 'over' : '';
  if (actual > budget * 1.005) return 'over';
  if (actual >= budget * 0.97) return 'full';
  if (expected != null && actual > expected + budget * 0.1) return 'warn';
  return '';
}
function budBar(actual, budget, expected){
  if (budget > 0 && actual > budget * 1.005){
    // 超出：整條長度＝實際花費，預算線之前是用完的預算（灰），之後是超出的部分（紅色斜紋）
    const lim = budget / actual * 100;
    return `<div class="bbar over"><i class="used" style="width:${lim.toFixed(1)}%"></i><i class="excess" style="left:${lim.toFixed(1)}%;right:0"></i>
      <b class="limit" style="left:calc(${lim.toFixed(1)}% - 1px)"></b></div>`;
  }
  const pct = budget > 0 ? Math.min(100, actual / budget * 100) : (actual > 0 ? 100 : 0);
  const mk = expected != null && budget > 0 && expected > 0 && expected < budget ? expected / budget * 100 : null;
  return `<div class="bbar"><i class="${budStatus(actual, budget, expected)}" style="width:${pct.toFixed(1)}%"></i>${mk != null ? `<b style="left:calc(${mk.toFixed(1)}% - 1px)"></b>` : ''}</div>`;
}
/* 各項參考：一行精簡顯示（名稱｜細長條｜金額），重點留給上方的年度總計 */
function budLineHTML(name, actual, budget, expected){

    <span class="v">${fmt(actual)}<small> / ${fmt(budget).replace(/^[^\d−]+/, '')}</small>${over ? `<em class="over">+${Math.round((actual - budget) / budget * 100)}%</em>` : st === 'warn' ? `<em class="warn">偏快</em>` : ''}</span></div>`;
}

function openBudgetEditor(year){

    <div id="blist"></div>

    <div class="formerr" id="berr"></div>
    <div class="savebar"><button class="btn ghost" id="bcancel">取消</button><button class="btn" id="bsave">儲存預算</button></div>`, body => {
    const paint = () => {
      const tot = lines.reduce((a, l) => a + (Number(l.amount) || 0) * (l.period === '月' ? 12 : 1), 0);
      $('#btot', body).innerHTML = '¥ ' + Math.round(tot).toLocaleString() + '<br><span class="tiny muted">每月約 ¥ ' + Math.round(tot / 12).toLocaleString() + '</span>';

          <div class="r2"><input class="input amt" data-k="amount" inputmode="decimal" value="${esc(l.amount)}"><div class="seg"><button data-per="月" aria-pressed="${l.period === '月'}">每月</button><button data-per="年" aria-pressed="${l.period === '年'}">每年</button></div><button class="chip" data-fix="${i}" aria-pressed="${!!l.fixed}">固定</button></div>

      if (b.dataset.del != null){ lines.splice(+b.dataset.del, 1); openMap = -1; paint(); return; }
      if (b.dataset.per){ lines[i].period = b.dataset.per; paint(); return; }
      if (b.dataset.fix != null){ lines[i].fixed = !lines[i].fixed; paint(); return; }
      if (b.dataset.map != null){ openMap = openMap === i ? -1 : i; paint(); return; }
      if (b.dataset.tok != null){
        const tok = b.dataset.tok; let ts = String(lines[i].map || '').split(/[,，、]/).map(t => t.trim()).filter(Boolean);
        ts = ts.includes(tok) ? ts.filter(t => t !== tok) : ts.concat([tok]);
        lines[i].map = ts.join(','); paint(); return;
      }
    });
    $('#byear', body).onchange = e => { year = e.target.value; lines = load(year); openMap = -1; paint(); };
    $('#badd', body).onclick = () => { lines.push({group:'', name:'', amount:0, period:'月', map:'', cur:'CNY', fixed:false}); openMap = lines.length - 1; paint(); };
    $('#bcancel', body).onclick = closeSheet;

      const clean = lines.filter(l => String(l.name).trim());
      if (!clean.length){ $('#berr', body).textContent = '至少要有一個預算項目'; return; }
      $('#bsave', body).disabled = true;
      try { S.budgets = await call('api_saveBudget', year, clean); }
      catch(e){ $('#bsave', body).disabled = false; $('#berr', body).textContent = e.message || String(e); return; }
      closeSheet(); toast(year + ' 年預算已儲存' + (S.view === 'stats' && budTarget() !== year ? `，在上方期間選「${year} 年」可查看` : ''));
      if (S.view === 'stats') renderStats();
    };
    paint();
  });
}

function prjTotals(name){
  let e = 0, s = 0, n = 0; const groups = {};
  S.records.forEach(r => { if (r.project !== name) return; const x = val(r); n++;
    if (r.type === '補貼') s += x; else { e += x; groups[r.cat] = (groups[r.cat] || 0) + x; } });
  return {e, s, n, groups};
}

function drawPrjChart(rows){
  const wrap = $('#pchart'); if (!wrap) return;
  const mm = {}; rows.forEach(r => { const m = ym(r.date), o = mm[m] || (mm[m] = {e:0, s:0}); r.type === '補貼' ? o.s += val(r) : o.e += val(r); });
  const ms = Object.keys(mm).sort(), a = ms[0], n = monthsBetween(a, ms[ms.length - 1]) + 1;
  const keys = []; for (let i = 0; i < n; i++) keys.push(addMonths(a, i));
  const data = keys.map(k => mm[k] || {e:0, s:0});
  const H = 150, padT = 8, padB = 20, axisW = 38, plotH = H - padT - padB;
  const maxE = Math.max(1, ...data.map(d => d.e)), maxS = Math.max(0, ...data.map(d => d.s)), tot = maxE + maxS;
  const zeroY = padT + plotH * maxE / tot, sc = plotH / tot;
  const avail = wrap.clientWidth - axisW - 26, step = Math.max(16, avail / keys.length), bw = Math.min(26, step * 0.64), W = step * keys.length + 6;
  let ax = `<svg class="axis" width="${axisW}" height="${H}" aria-hidden="true">`, svg = `<svg width="${W}" height="${H}" role="img" aria-label="專項每月支出">`;
  niceTicks(maxE).forEach(t => { const y = zeroY - t * sc; svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--rule-soft)"/>`; ax += `<text x="${axisW - 5}" y="${y + 4}" text-anchor="end">${compact(t)}</text>`; });
  ax += '</svg>'; svg += `<line x1="0" x2="${W}" y1="${zeroY}" y2="${zeroY}" stroke="var(--ink-2)"/><g class="bars">`;
  keys.forEach((k, i) => { const x = i * step + (step - bw) / 2, d = data[i];
    svg += `<g class="bar" data-i="${i}"><rect x="${i * step}" y="${padT}" width="${step}" height="${plotH}" fill="transparent"/>`;
    if (d.e) svg += `<rect x="${x}" y="${zeroY - d.e * sc}" width="${bw}" height="${d.e * sc}" fill="var(--ink)" rx="1"/>`;
    if (d.s) svg += `<rect x="${x}" y="${zeroY}" width="${bw}" height="${d.s * sc}" fill="var(--plus)" rx="1"/>`;
    svg += '</g>';
    const lab = i === 0 || k.endsWith('-01') ? k.slice(2, 4) + '/' + +k.slice(5) : (keys.length <= 12 ? +k.slice(5) + '月' : '');
    if (lab) svg += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${lab}</text>`; });
  svg += '</g></svg>';
  wrap.innerHTML = ax + `<div class="scroll">${svg}</div>`;
  const info = i => { const d = data[i], k = keys[i];
    $('#pinfo').innerHTML = `<span>${k.slice(0, 4)} 年 ${+k.slice(5)} 月</span><span>支出 <b>${fmt(d.e)}</b></span>${d.s ? `<span class="p">補貼 <b>${fmt(d.s)}</b></span>` : ''}`;
    $$('.bar', wrap).forEach(g => g.style.opacity = +g.dataset.i === i ? 1 : .55); };
  $$('.bar', wrap).forEach(g => g.addEventListener('click', () => info(+g.dataset.i)));
  let big = 0; data.forEach((d, i) => { if (d.e > data[big].e) big = i; }); info(big);
}

    <div class="sec" style="margin-top:18px"><h3>連線與同步</h3>
      <dl class="kv"><dt>狀態</dt><dd id="syncState"></dd><dt>上次同步</dt><dd>${esc(Net.lastSync || '—')}</dd><dt>App 版本</dt><dd>${esc((document.querySelector('meta[name=app-version]') || {}).content || '—')}</dd></dl>
      <button class="linkbtn" id="sconn">修改連線設定</button>　<button class="linkbtn" id="ssyncnow">立即同步</button>　<button class="linkbtn" id="supdate">檢查更新</button></div>
    <p class="tiny muted" style="margin-top:14px">分類、印章字和顏色在試算表的 Categories 分頁修改；改完後按下方「重新載入」。</p>
    <div class="savebar"><button class="btn ghost" id="sreload">重新載入</button><button class="btn" id="ssave">儲存設定</button></div>`, body => {
    $('#ssave', body).onclick = async () => {
      const o = {'預設幣別':$('#sdef', body).value, '換算方式':$('#smode', body).value, '統計起始日':$('#sstart', body).value};
      Object.assign(S.settings, o);
      closeSheet(); remountForms(); afterChange();
      try { await call('api_saveSettings', o); toast('設定已儲存'); } catch(e){ fail(e); }
    };
    $('#srate', body).onclick = async e => {
      e.target.textContent = '更新中……';
      try { const r = await call('api_refreshRates', true); S.rates = r.rates; S.settings = r.settings; buildRates(); closeSheet(); afterChange(); toast('匯率已更新'); }
      catch(err){ e.target.textContent = '立即更新匯率'; fail(err); }
    };
    $('#sreload', body).onclick = () => { closeSheet(); boot(true); };
    $('#syncState', body).textContent = Net.outbox.length ? `${Net.outbox.length} 筆待同步` : (Net.lastErr ? '上次同步失敗：' + Net.lastErr : '已同步');
    $('#sconn', body).onclick = () => openConnect(false);
    $('#supdate', body).onclick = async () => {
      const el = $('#supdate', body); el.textContent = '檢查中…';
      try { const reg = await navigator.serviceWorker.getRegistration(); if (!reg) throw 0; await reg.update();
        setTimeout(() => { if (reg.waiting){ el.textContent = '檢查更新'; toast('有新版本', { action: '更新', onAction: () => reg.waiting.postMessage('skipWaiting') }); } else { el.textContent = '已是最新'; } }, 1500); }
      catch(e){ el.textContent = '檢查更新'; toast('無法檢查更新，請關掉 App 重開', { err: true }); }
    };
    $('#ssyncnow', body).onclick = async () => { await sync(true); $('#syncState', body).textContent = Net.lastErr ? '同步失敗：' + Net.lastErr : '已同步'; toast(Net.lastErr ? '同步失敗' : '已同步'); };
  });
}
$('#btnSettings').onclick = openSettings;

/* =====================================================================
 *  問帳本（AI）— 平常收在一條細欄裡，點了才展開
 * ===================================================================== */
S.chat = [];
const ASK_SAMPLES = ['最近三個月哪些品項花最多？', '這個月跟平常比起來如何？', '幫我排下個月的預算', '有哪些地方可以省錢？'];
function mdLite(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let html = '', list = null;
  const close = () => { if (list){ html += `</${list}>`; list = null; } };
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^\s*[-•*]\s+(.*)/))){ if (list !== 'ul'){ close(); html += '<ul>'; list = 'ul'; } html += `<li>${m[1]}</li>`; }
    else if ((m = l.match(/^\s*\d+[.、)]\s+(.*)/))){ if (list !== 'ol'){ close(); html += '<ol>'; list = 'ol'; } html += `<li>${m[1]}</li>`; }
    else if ((m = l.match(/^#{1,6}\s+(.*)/))){ close(); html += `<h4>${m[1]}</h4>`; }
    else if (l.trim()){ close(); html += `<p>${l}</p>`; }
    else close();
  });
  close(); return html;
}
function openAsk(){
  openSheet(`<h3>問帳本</h3>
    <div class="chat" id="chat"></div>
    <div class="chips" id="askChips"></div>
    <div class="askrow"><textarea class="input" id="askIn" rows="1" placeholder="問任何關於你帳本的事" enterkeyhint="send"></textarea><button class="btn" id="askGo">問</button></div>
    <p class="tiny muted" style="margin:8px 0 0">由 Claude 依你的帳本回答，僅供參考。提問時會把帳本摘要傳給 Anthropic。</p>`, body => {
    const input = $('#askIn', body);
    const paint = () => {
      if (!body.isConnected || !$('#chat', body)) return;   // 面板已關閉：結果留在 S.chat，下次打開再顯示
      $('#chat', body).innerHTML = S.chat.map((m, i) => m.role === 'user' ? `<div class="msg u">${esc(m.content)}</div>`
        : `<div class="msg a${m.err ? ' err' : ''}">${m.pending ? `<span class="thinking">翻帳中…<span class="sec"></span></span>`
            : (m.err ? esc(m.content) + (m.q ? `<br><button class="retry" data-retry="${i}">再問一次</button>` : '') : mdLite(m.content))}</div>`).join('');
      $('#askChips', body).innerHTML = S.chat.length ? '' : ASK_SAMPLES.map(q => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join('');
      const sh = $('#sheet'); sh.scrollTop = sh.scrollHeight;
    };
    const ask = async q => {
      q = String(q || '').trim(); if (!q || S.chat.some(m => m.pending)) return;
      // 只把成功的「問→答」帶給 AI 當上下文
      const history = [];
      for (let i = 0; i + 1 < S.chat.length; i++){ const u = S.chat[i], a = S.chat[i + 1];
        if (u.role === 'user' && a.role === 'assistant' && !a.err && !a.pending){ history.push({role:'user', content:u.content}, {role:'assistant', content:a.content}); i++; } }
      S.chat.push({role:'user', content:q}); const ans = {role:'assistant', content:'', pending:true, t0:Date.now()}; S.chat.push(ans);
      input.value = ''; paint();
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('等了 90 秒還沒有回應，可能是網路或 AI 服務暫時有問題。')), 90000));
      try { ans.content = await Promise.race([call('api_ask', q, history.slice(-8)), timeout]); }
      catch(e){ ans.content = e.message || String(e); ans.err = true; ans.q = q; }
      ans.pending = false; paint();
    };
    clearInterval(S.askTimer);
    S.askTimer = setInterval(() => {   // 等待時顯示經過秒數，讓人知道還在跑
      const p = S.chat.find(m => m.pending), el = $('#chat .sec', body);
      if (p && el){ const n = Math.round((Date.now() - p.t0) / 1000); el.textContent = n >= 5 ? `　${n} 秒` : ''; }
    }, 1000);
    $('#chat', body).onclick = e => { const b = e.target.closest('[data-retry]'); if (!b) return;
      const i = +b.dataset.retry, q = S.chat[i] && S.chat[i].q; if (!q) return; S.chat.splice(i - 1, 2); ask(q); };
    $('#askChips', body).onclick = e => { const b = e.target.closest('[data-ask]'); if (b) ask(b.dataset.ask); };
    $('#askGo', body).onclick = () => ask(input.value);
    input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask(input.value); } };
    input.oninput = () => { input.style.height = 'auto'; input.style.height = Math.min(120, input.scrollHeight) + 'px'; };
    paint(); input.focus();
  });
}
$('#askOpen').onclick = openAsk;

/* =====================================================================
 *  Navigation & boot
 * ===================================================================== */
function go(view){
  S.view = view;
  $$('.tabs button').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + view));
  render(); window.scrollTo(0, 0);
}
$$('.tabs button').forEach(b => b.onclick = () => { if (b.dataset.view === 'stats') S.stats.range = S.today.slice(0, 4); go(b.dataset.view); });   // 每次打開統計都從今年看起
$$('.curswitch button').forEach(b => b.onclick = () => { S.disp = b.dataset.cur; store.set('disp', S.disp); paintCurSwitch(); afterChange(); });
function paintCurSwitch(){ $$('.curswitch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cur === S.disp)); }
function render(){
  if (S.view === 'add') renderAdd();
  else if (S.view === 'list') renderList();
  else if (S.view === 'stats') renderStats();
  else renderPrj();
}
function afterChange(){ render(); }
function remountForms(){ const v = $('#v-add'); delete v.dataset.mounted; const l = $('#v-list'); delete l.dataset.mounted; }

function applyData(d){
  S.records = d.records; S.cats = d.categories; S.projects = d.projects; S.rates = d.rates; S.settings = d.settings || {};
  S.templates = d.templates || []; S.budgets = d.budgets || [];
  buildRates(); remountForms();
}
async function boot(fresh){
  if (Net.pendingCfg){ const ok = await applyPendingCfg(); if (ok) fresh = true; }
  applyScopeUI();
  if (!Net.cfg){ openConnect(true); paintSync(); return; }
  const box = $('#loading'); box.className = 'loading'; box.textContent = '翻開帳簿……';
  if (!Net.cache || fresh) box.hidden = false;
  try {
    const d = await call('api_bootstrap', !!fresh);
    S.today = localToday();
    applyData(d);
    S.disp = store.get('disp', S.settings['顯示幣別'] || 'CNY');
    Object.assign(S.stats, store.get('stats', {}));
    S.stats.range = S.today.slice(0, 4);   // 統計頁一打開就看今年
    paintCurSwitch();
    box.hidden = true; Net.booted = true; paintSync();
    go(S.view);
    setTimeout(bgRates, 2500);
  } catch(e){
    box.hidden = false;
    box.innerHTML = '打不開帳簿：' + esc(e.message || e) + '<br><button class="linkbtn" onclick="boot(true)">再試一次</button>　<button class="linkbtn" onclick="openConnect(true)">重新設定連線</button>';
  }
}
/* 畫面出來後再在背景檢查匯率（超過 6 小時才真的去抓） */
async function bgRates(){
  if (!Net.cfg || !navigator.onLine) return;
  try {
    const before = S.settings['匯率更新時間'];
    const r = await call('api_refreshRates', false);
    if (r.settings['匯率更新時間'] !== before){ S.rates = r.rates; S.settings = r.settings; buildRates(); if (S.view !== 'add') render(); else renderAddSide(); }
  } catch(e){}
}
/* 「今天」＝手機的本地日期；App 回到前景時若已跨日，自動更新 */
function localToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function checkDay(){
  const t = localToday(); if (!S.today || t === S.today) return;
  const old = S.today; S.today = t;
  $$('input.date').forEach(el => { if (el.value === old) el.value = t; });   // 沒改過的日期欄跟著換成今天
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);
setInterval(checkDay, 60000);
boot();
</script>
